# Overrides for scripts/evi-container-smoke.sh only.
#
# CRITICAL — volumes. The base file bind-mounts `./data/postgres` and
# `./data/qdrant`. A bind mount ignores the compose project name, so running the
# smoke under `-p evi-smoke` still points at the DEV data directory. Two postgres
# instances sharing one data dir corrupt it — which is exactly what happened on
# 2026-08-12: the smoke instance took the lock file, the dev instance shut down
# immediately, and the checkpoint record was left invalid. The `!override` +
# named-volume entries below are what make the isolation real instead of nominal.
#
# Ports use `!reset` / `!override` because Compose merges list values by
# appending: a plain `ports: []` keeps the base entry and collides with a
# running dev stack.
#
# The port-binding assertion deliberately reads the REAL `docker compose config`
# (no -p, no override), so this file cannot mask a regression there.
services:
  postgres:
    ports: !reset []
    volumes: !override
      - smoke-postgres:/var/lib/postgresql/data
  qdrant:
    ports: !reset []
    volumes: !override
      - smoke-qdrant:/qdrant/storage
  agent-api:
    # CRITICAL — env_file. The base file loads the developer's `.env`, which the
    # compose project name does not isolate either. Two consequences, both seen
    # on 2026-08-12: in CI there is no `.env`, so `docker compose config` fails
    # outright and the smoke never ran; locally the smoke inherited the real
    # GEMINI_API_KEY / TELEGRAM_BOT_TOKEN / EVOLUTION_API_KEY plus
    # TELEGRAM_MODE=polling, and started a SECOND poller against the real bot —
    # 25 `HTTP Error 409: Conflict` in the dev agent-api log.
    # The smoke supplies its own environment; it must never read `.env`.
    env_file: !reset []
    ports: !override
      - "127.0.0.1::8000"
    volumes: !override
      - ./tests/fixtures:/fixtures:ro
      - ./EVI_WORKSPACE:/workspace:ro
      - smoke-logs:/logs
      - smoke-contact-memory:/data/contact_memory

volumes:
  smoke-postgres:
  smoke-qdrant:
  smoke-logs:
  smoke-contact-memory:
