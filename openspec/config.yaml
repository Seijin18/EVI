# OpenSpec project context — EVI (Evolving Virtual Intelligence)
schema: spec-driven

context: |
  EVI: FastAPI + LangGraph ReAct + Qdrant + Postgres sessions.
  LLM: Gemini gemini-2.5-flash (EVI_LLM_PROVIDER=gemini, prod); Ollama
  qwen2.5:3b-instruct-q4_K_M as fallback and background tier.
  Orchestration: Windmill (scripts in repo, wmill sync push one-way; schedules live in the UI).
  WhatsApp: Evolution API webhooks (unofficial, personal number) — read + low-volume control only.
  n8n and the dev bridge are removed — do not reintroduce either.

  Hardware: 16GB RAM, GTX 1060 3GB — OLLAMA_MAX_LOADED_MODELS=1; no local audio/vision models.

  Product direction (2026-10-10, docs/ux-review-2026-10.md): EVI reaches the user with
  what needs action instead of waiting to be asked. Priority: proactive delivery on
  Telegram (briefing, reminders) > productivity actions (calendar, tasks, email,
  WhatsApp reply debts) > voice input > university RAG (secondary).
  Third-party content (email, WhatsApp, contact profiles) is data, never instruction:
  wrap with wrap_external before it reaches an LLM prompt.

  Conventions: tools in agent/tools/; register in agent/tools/registry.py;
  bounded memory (8 pairs); secrets in .env only.

  Source of truth: openspec/specs/ (not Progress.md; overview in README.md).
  Active work: exactly one folder under openspec/changes/ — read openspec/AGENTS.md first.

  Verification: Tier 1 unit tests + Tier 2 ./scripts/evi-test <feature> before archive.
  Apply: use `openspec instructions apply --change <name> --json` for contextFiles only.

  Architecture review ritual (quarterly or after major feature):
  1. `./scripts/evi-test smoke` + `openspec validate --specs`
  2. Compare as-built vs `openspec/specs/`; update `openspec/BACKLOG.md`
  3. One active change; archive before starting next.

rules:
  proposal:
    - Max 15 lines of intent; link product priority.
    - List explicit Out of scope.
    - "Mudança de comportamento observável declara `## Validação em uso real` com KPI, limiar e janela (padrão 7 dias). Arquivar não espera a janela; o resultado é registrado no BACKLOG quando a janela fecha (relatório semanal `/jobs/usage-report`)."
  tasks:
    - "Each task MUST include SCN-* (if applicable), Files (max 5 paths), Verify (evi-test command)."
    - "Behaviour tasks include a simulation scenario (`tests/sim/scenarios/<area>/`) in Verify: `./scripts/evi-sim run --id <SIM-...> --repeat 3 --llm live`."
    - One logical deliverable per task; 5-12 tasks per change.
    - "Change que adiciona superfície (porta, rota, tool de escrita, canal de entrada, provedor de LLM, segredo) inclui uma task de revisão leve: atualizar docs/security/threat-model.md, rodar ./scripts/evi-security-scan e registrar achados em docs/security/findings.md."
  design:
    - RAM impact for new containers; Windmill/Evolution ports.
    - Out of scope section required.
  apply:
    - Do NOT read Progress.md unless the user asks (use README.md + specs).
    - Do NOT read files outside the current task Files list and contextFiles from CLI.
    - Mark tasks [x] immediately after Verify passes.
    - Prefer get_code_snippet / offset+limit over full file reads.
