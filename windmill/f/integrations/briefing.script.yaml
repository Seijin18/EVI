summary: EVI morning briefing
description: POST agent-api /jobs/briefing?kind=&force= (briefing diario no Telegram). Agendar 07:00 (kind=morning); opcional 21:00 (kind=evening). Requer EVI_BRIEFING_ENABLED=true no .env.
lock: '!inline f/integrations/briefing.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    kind:
      type: string
      default: morning
      enum:
        - morning
        - evening
    force:
      type: boolean
      default: false
  required: []
