id: SIM-REM-05
title: Lembrete pontual - "feito" depois da entrega conclui o lembrete
tags: [reminders]
source: synthetic
clock: D0 17:00
steps:
  - telegram: "me lembra às 18h de pagar o boleto"
    expect:
      reply_within_s: 90
      postgres:
        - {table: reminders, where: {status: pending}, count: 1}
  - clock: "D0 18:00"
    expect:
      reply_within_s: 30
      reply_matches: "(?i)boleto"
  - telegram: "feito"
    expect:
      reply_within_s: 90
      postgres:
        - {table: reminders, where: {status: done}, count: 1}
      outbound_to_third_parties: 0
