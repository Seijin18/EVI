id: SIM-RU-03
title: Real - listar compromissos do mês
tags: [real-usage, calendar]
source: real-usage
clock: D0 09:00
seed:
  calendar:
    - {summary: "Revisão do Projeto Lótus", start: "D0 15:00", end: "D0 16:00"}
    - {summary: "Churrasco da Turma", start: "D0 19:00", end: "D0 21:00"}
steps:
  - telegram: "Quais são meus compromissos deste mês?"
    expect:
      reply_within_s: 90
      reply_matches: "lótus|lotus"
      tools_called_any: [list_calendar_events, list_events]
      outbound_to_third_parties: 0
      tools_not_called: [schedule_event, create_task, delete_emails, delete_emails_by_query, confirm_commitments, dismiss_commitments, set_whatsapp_contact_name, learn_whatsapp_contact]
