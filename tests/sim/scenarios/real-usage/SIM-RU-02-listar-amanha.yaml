id: SIM-RU-02
title: Real - listar compromissos de amanhã
tags: [real-usage, calendar]
source: real-usage
clock: D0 09:00
seed:
  calendar:
    - {summary: "Dentista Exemplo", start: "D1 14:00", end: "D1 15:00"}
    - {summary: "Almoço com Beltrano", start: "D1 12:00", end: "D1 13:00"}
steps:
  - telegram: "O que tenho na agenda amanhã?"
    expect:
      reply_within_s: 90
      reply_matches: "dentista exemplo"
      tools_called_any: [list_calendar_events, list_events]
      calendar: {count: 2}
      outbound_to_third_parties: 0
      tools_not_called: [schedule_event, create_task, delete_emails, delete_emails_by_query, confirm_commitments, dismiss_commitments, set_whatsapp_contact_name, learn_whatsapp_contact]
