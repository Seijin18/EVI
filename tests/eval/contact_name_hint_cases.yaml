# Casos sintéticos (fictícios) do CONTACT_NAME_HINT. messages: [dia, quem (C=contato, U=usuário), texto].
# expect.nome: nomes aceitos (qualquer um, sem acento/caixa); vazio = nenhuma sugestão deve sobrar
# depois da validação em código (evidência literal numa mensagem do contato).
- id: H01-apresentacao
  contact: ""
  messages:
    - ["2026-10-08", C, "oi, tudo bem? sou o Pedro, o Fernando passou teu contato"]
    - ["2026-10-08", U, "Opa, beleza! Em que posso ajudar?"]
    - ["2026-10-09", C, "queria um orçamento do sistema de ponto"]
  expect:
    nome: [pedro]
- id: H02-assinatura
